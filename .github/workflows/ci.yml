name: CI

on:
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.github/workflows/ci.yml'
      - 'mise.toml'
      - 'sqlc.yaml'
      - 'db/**'
      - 'migrations/**'
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.github/workflows/ci.yml'
      - 'mise.toml'
      - 'sqlc.yaml'
      - 'db/**'
      - 'migrations/**'

permissions:
  contents: read
  pull-requests: read
  checks: write
  security-events: write
  actions: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Go and sqlc at the versions pinned in mise.toml.
      - name: Install pinned tools
        uses: jdx/mise-action@v5
        with:
          install_args: go sqlc

      # generated/ is committed so go install works without sqlc; fail if it
      # is stale relative to migrations/ and db/query.sql.
      - name: Check generated code is up to date
        run: |
          mise run generate
          if [ -n "$(git status --porcelain -- generated/)" ]; then
            git status --short -- generated/
            git diff -- generated/
            echo "::error::generated/ is stale; run 'mise run generate' and commit the result"
            exit 1
          fi

      - name: Download dependencies
        run: mise exec -- go mod download

      - name: Verify dependencies
        run: mise exec -- go mod verify

      - name: Run tests
        run: mise exec -- go test -v -race ./...
        env:
          TESTCONTAINERS_RYUK_DISABLED: true

      - name: Run go vet
        run: mise exec -- go vet ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2 # keep in sync with mise.toml
          args: --timeout=10m
          only-new-issues: true
          skip-cache: false
          skip-save-cache: false

